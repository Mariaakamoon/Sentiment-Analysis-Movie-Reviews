<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineScope — Movie Q&amp;A</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem("cinescope-theme")||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="/" aria-label="CineScope home"><span class="brand-mark">C</span><span>Cine<span>Scope</span></span></a><nav aria-label="Primary navigation"><a href="/movies">Movies</a><a href="/analyzer">Review lab</a><a href="/ask">Movie Q&amp;A</a></nav><button class="theme-toggle" id="theme-toggle" type="button">◐ <span>Theme</span></button></header>
  <main class="content-section page-main"><p class="eyebrow">CONTEXT, NOT GUESSWORK</p><h1 class="page-title">Ask about<br><em>the film.</em></h1><p class="hero-lede">Answers are grounded in the metadata CineScope can verify, and unsupported questions are not guessed.</p><div class="panel qa-panel"><div class="qa-toolbar"><label for="movie-select">Movie context</label><select id="movie-select"><option value="">Loading library...</option></select><label class="switch"><input id="spoilers" type="checkbox"><span></span> Spoilers on</label></div><div class="chat" id="chat" aria-live="polite"><p class="assistant-message">Choose a movie, then ask about its story, genres, runtime, or cast.</p></div><form class="ask-form" id="ask-form"><label class="sr-only" for="question">Ask about this movie</label><input id="question" placeholder="What is this movie about?"><button type="submit" aria-label="Send question">↑</button></form></div></main>
  <footer><span>© 2026 CineScope</span><span>Metadata by <a href="https://www.themoviedb.org/" rel="noreferrer">TMDB</a>.</span></footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script><script src="{{ url_for('static', filename='js/ask.js') }}"></script>
